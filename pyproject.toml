[project]
name = "ai-halyk"
version = "2.0.0"
description = "Agentic Bank hackathon: категоризация леджера, факты из документов, проверка ковенантов"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Nikita Vinnikov", email = "nvvinnikov@gmail.com"}]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pypdf==5.1.0",
    "anthropic>=0.40",
    "jsonschema>=4.23",
]

[project.urls]
repository = "https://github.com/nvinnikov/ai-halyk-hackathon"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.6",
    "mypy==1.15.0",
]

# Репозиторий — не библиотека, а набор скриптов, запускаемых из корня
# (`python solution/solve.py`). Собирать и устанавливать нечего.
[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["solution", "tests", "tools"]

[tool.ruff.lint]
# pyflakes(F), pycodestyle(E/W), isort(I), bugbear(B), pyupgrade(UP), comprehensions(C4)
select = ["E", "F", "W", "I", "B", "UP", "C4"]
# E402: модули solution/* делают sys.path.insert(0, "solution") до импортов —
# это осознанный способ запускать их из корня без установки пакета.
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["solution", "tests", "tools"]
# Код гоняется на скорость хакатона и почти не типизирован: проверяем то, что
# можно проверить без аннотаций, вместо того чтобы глушить весь mypy.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not llm'"
markers = ["llm: тесты, которые ходят в Anthropic API (не входят в make check)"]
