# Автоматический review пул-реквестов.
#
# Ручки настройки:
#   - Глубина/строгость .... строка "Depth:" в промпте ниже
#   - Схема severity ....... строка "Severity:" в промпте
#   - Модель ............... claude_args --model
#   - Бюджет ходов ......... claude_args --max-turns
#   - Что пропускать ....... on.pull_request.paths-ignore
#
# Нужен секрет репозитория CLAUDE_CODE_OAUTH_TOKEN. Без него джоба — no-op;
# сборку в любом случае гейтит ci.yml.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'

# Новый пуш в тот же PR отменяет незавершённый review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Ты — автоматический ревьюер этого репозитория. Здесь решение кейса
            хакатона Agentic Bank: из банковского леджера (master_ledger_2025.csv)
            и PDF-документов заёмщиков считаются финансовые ковенанты (пункты
            6.1/6.2/6.3) по каждому сценарию, результат ложится в
            solution/submission.json и скорится против ground_truth.json.

            Читай изменения через `gh pr diff`. НЕ запускай инструменты — ни ruff,
            ни mypy, ни pytest. Ревьюь статически по диффу; можешь читать соседние
            файлы через Read/Grep для контекста. Формат, линт, типы и тесты уже
            гейтит CI.

            Приоритеты, по убыванию:
              1. Дрейф пакета задания — правки в dataset/**, включая CASE.*.md,
                 ground_truth.json, master_ledger_2025.csv и submission_template.json.
                 Это входные данные от организаторов, они должны оставаться
                 байт-в-байт как получены.
              2. Подгонка под ответ — захардкоженные статусы, actual или
                 evidence_txn_id, ветвления по номеру сценария, вычитывание
                 ground_truth.json в коде решения. Логика должна выводить ответ из
                 леджера и документов, а не воспроизводить ключ.
              3. Регрессия качества — изменения в covenants.py / facts.py /
                 categorize.py / engine.py, которые роняют скор, при этом BASELINE
                 в tests/test_solution.py понижен или тест ослаблен.
              4. Недетерминизм — now()/random/uuid, зависимость от порядка обхода
                 файловой системы или множеств, незакреплённые зависимости.
              5. Молчаливые потери данных — проглоченные исключения, строки
                 леджера, тихо выпадающие из расчёта (пустая сумма, неизвестная
                 валюта, непопавшая категория), непокрытый ZeroDivisionError.
              6. Корректность финансовой логики — знак суммы (расход как модуль
                 отрицательной строки), конвертация валют по fx, границы периода
                 (Q4, годовые окна), направление ковенанта max/min, срабатывание
                 springing-тестов, нормализация названий контрагентов.
              7. Отсутствие тестов — изменение поведения без теста в tests/.

            Depth: BALANCED. Пиши только реальные замечания средней и высокой
            уверенности. Придирки по стилю пропускай — их гейтит ruff.
            Не выдумывай находки.

            Severity: каждый inline-комментарий начинай ровно с одного маркера:
              🔴 Blocker — дрейф пакета задания, подгонка под ответ, регрессия
                 скора, недетерминизм, молчаливая потеря данных или ошибка в
                 формуле ковенанта; чинить до мержа.
              🟡 Should-fix — реальная проблема, не блокирующая мерж.
            Если замечание тянет только на nit — не публикуй его вовсе.

            Замечания публикуй inline на конкретные строки через
            `mcp__github_inline_comment__create_inline_comment` с
            `confirmed: true`. Затем одним `gh pr comment` — краткое summary со
            счётом (например "2 🔴, 1 🟡") и сквозными замечаниями. Если поднимать
            нечего — короткое summary, что PR чистый.

            Все комментарии — на русском.
          claude_args: |
            --model claude-opus-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
