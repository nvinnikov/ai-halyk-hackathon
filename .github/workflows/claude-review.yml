# Автоматический review пул-реквестов.
#
# САМИ ПРАВИЛА ЛЕЖАТ В .github/REVIEW.md — тюнить надо там, а не здесь.
# Причина: claude-code-action отказывается запускаться, если PR правит файл
# review-workflow, так что правка правил в этом yaml отключала бы ревью на том
# же PR. REVIEW.md под это ограничение не подпадает.
#
# Ручки, которые всё-таки живут здесь:
#   - Глубина/строгость .... строка "Depth:" в промпте ниже
#   - Модель ............... claude_args --model
#   - Бюджет ходов ......... claude_args --max-turns
#   - Доступные инструменты  claude_args --allowedTools
#   - На что не запускаться  on.pull_request.paths-ignore
#
# Нужен секрет репозитория CLAUDE_CODE_OAUTH_TOKEN. Без него джоба скипается
# по HAS_TOKEN; сборку в любом случае гейтит ci.yml.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'

# Новый пуш в тот же PR отменяет незавершённый review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    # Контекст secrets недоступен в `if` на уровне job и step, поэтому наличие
    # токена прокидывается через env — иначе шаг с пустым секретом не
    # пропускается, а падает, и на PR висит красный крест.
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Ты — автоматический ревьюер этого репозитория.

            Первым делом прочитай `.github/REVIEW.md` — там контекст проекта,
            приоритеты, шкала severity, список того, что комментировать не надо,
            и требуемый формат вывода. Следуй ему буквально; ниже — только то,
            что в файл не помещается.

            Читай изменения через `gh pr diff`. НЕ запускай инструменты — ни ruff,
            ни mypy, ни pytest. Ревьюь статически по диффу; соседние файлы можно
            открывать через Read/Grep для контекста. Формат, линт, типы и тесты
            уже гейтит ci.yml.

            Depth: BALANCED. Пиши только реальные замечания средней и высокой
            уверенности. Не выдумывай находки: лучше пустая сводка, чем
            правдоподобное, но непроверенное замечание.

          claude_args: |
            --model claude-opus-5
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
