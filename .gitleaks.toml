# Конфиг для джобы Secret scan (gitleaks/gitleaks-action@v2 сам подхватывает
# .gitleaks.toml из корня).
#
# Полный дефолтный набор правил на весь репозиторий плюс узкие allowlist'ы.
#
# dataset/** — пакеты задания от организаторов (публичный и опубликованный с их
# разрешения закрытый набор): PDF (бинарь, который дефолтные эвристики читают как
# текст) и синтетический леджер с id контрагентов и счетов. Реальных кредов там
# нет, а на generic-api-key такие высокоэнтропийные строки шумят.
# eval/cassette/ — замороженные ответы модели, не секреты.
# .env.example — плейсхолдеры без значений.
# Весь остальной репозиторий, включая solution/ и настоящий .env, сканируется
# дефолтными правилами.

title = "ai-halyk gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "пакеты задания, кассета ответов модели и шаблон env: синтетика, не креды"
paths = [
    '''dataset/''',
    '''eval/cassette/''',
    '''\.env\.example''',
]
