# Конфиг для джобы Secret scan (gitleaks/gitleaks-action@v2 сам подхватывает
# .gitleaks.toml из корня).
#
# Полный дефолтный набор правил на весь репозиторий плюс один узкий allowlist.
#
# dataset/agentic-bank-public/ — пакет задания от организаторов: 203 PDF (бинарь,
# который дефолтные эвристики читают как текст) и синтетический леджер с id
# контрагентов и счетов. Реальных кредов там нет, а на generic-api-key такие
# высокоэнтропийные строки шумят. Allowlist ограничен этой одной директорией —
# весь остальной репозиторий, включая solution/, сканируется дефолтными правилами.

title = "ai-halyk gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "пакет задания: синтетические данные кейса, не креды"
paths = ['''dataset/agentic-bank-public/''']
